name: encqder
description: "A private, offline-first QR code scanner and generator for Android."
publish_to: "none"

version: 1.1.0+8

environment:
  sdk: ^3.12.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

  archive: ^4.0.9
  dynamic_color: ^1.9.0
  file_selector: ^1.1.0
  gal: ^2.3.3
  mobile_scanner: ^7.4.2
  path_provider: ^2.1.6
  pretty_qr_code: ^3.6.0
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/app_icon.jpg"
  min_sdk_android: 24

flutter_native_splash:
  android: true
  ios: false
  web: false
  color: "#FFFFFF"
  image: "assets/splash_light.png"
  color_dark: "#000000"
  image_dark: "assets/splash_dark.png"
  android_12:
    color: "#FFFFFF"
    image: "assets/splash_light.png"
    color_dark: "#000000"
    image_dark: "assets/splash_dark.png"
